basePath: /
definitions:
  github_com_ssklv_mixfood-order-service_internal_domain.CreateOrderInput:
    properties:
      address_id:
        type: integer
      delivery_time:
        type: string
      items:
        items:
          $ref: '#/definitions/github_com_ssklv_mixfood-order-service_internal_domain.OrderItem'
        type: array
    type: object
  github_com_ssklv_mixfood-order-service_internal_domain.Order:
    properties:
      address_id:
        type: integer
      created_at:
        type: string
      delivery_time:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/github_com_ssklv_mixfood-order-service_internal_domain.OrderItem'
        type: array
      status:
        type: string
      total_price:
        type: number
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  github_com_ssklv_mixfood-order-service_internal_domain.OrderItem:
    properties:
      id:
        type: integer
      order_id:
        type: integer
      price:
        type: number
      product_id:
        type: integer
      quantity:
        type: integer
    type: object
  github_com_ssklv_mixfood-order-service_internal_domain.UpdateStatusInput:
    properties:
      status:
        type: string
    type: object
host: localhost:8083
info:
  contact: {}
  description: API для управления заказами
  title: Mixfood Order Service API
  version: "1.0"
paths:
  /api/v1/admin/orders:
    get:
      parameters:
      - description: Лимит
        in: query
        name: limit
        type: integer
      - description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_ssklv_mixfood-order-service_internal_domain.Order'
            type: array
      security:
      - BearerAuth: []
      summary: Получение всех заказов (для админа)
      tags:
      - admin
  /api/v1/admin/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Только для администраторов
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: integer
      - description: Новый статус
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_ssklv_mixfood-order-service_internal_domain.UpdateStatusInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Обновление статуса заказа
      tags:
      - admin
  /api/v1/orders:
    get:
      consumes:
      - application/json
      description: Возвращает историю заказов текущего авторизованного пользователя
        с пагинацией
      parameters:
      - description: Bearer JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Количество заказов (default 10)
        in: query
        name: limit
        type: integer
      - description: Смещение (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_ssklv_mixfood-order-service_internal_domain.Order'
            type: array
        "401":
          description: Неавторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получение заказов пользователя
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Принимает корзину товаров и адрес, высчитывает стоимость и создает
        заказ
      parameters:
      - description: Bearer JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Данные для создания заказа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_ssklv_mixfood-order-service_internal_domain.CreateOrderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ssklv_mixfood-order-service_internal_domain.Order'
        "400":
          description: Невалидные входные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Пользователь не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Создание нового заказа
      tags:
      - orders
securityDefinitions:
  CookieAuth:
    in: cookie
    name: jwt
    type: apiKey
swagger: "2.0"
